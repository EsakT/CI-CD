# .github/workflows/deploy.yml

name: CI/CD Pipeline

on:
  push:
    branches: [main]        # Runs on every push to main
  pull_request:
    branches: [main]        # Also runs on PRs (CI check only)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull your code
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      # 2. (Optional) Validate HTML
      - name: 🔍 Lint HTML
        run: |
          echo "Running checks..."
          # Check index.html exists
          test -f index.html && echo "index.html found ✓"

      # 3. (Optional) Run tests — add your real test commands here
      - name: 🧪 Run tests
        run: echo "All tests passed ✓"

      # 4. Deploy to Netlify
      - name: 🚀 Deploy to Netlify
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: '.'           # Folder to deploy (root = .)
          production-branch: main    # Only main goes to production
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: "nfp_B2C48kDtL5KJ7C22J7wNMdT7k3wE9WGJdfd5"
          NETLIFY_SITE_ID: "48ec83ea-7c64-45ff-a670-3c8b1b42aa05"